# Construit le site et l'envoie sur l'hébergement LWS par FTP à chaque modification de la branche main.
#
# À configurer une seule fois dans GitHub : Settings > Secrets and variables > Actions
#   Secrets   : FTP_SERVER, FTP_USERNAME, FTP_PASSWORD  (fournis dans l'espace client LWS)
#   Variable (facultative) : FTP_SERVER_DIR — par défaut ./ car le compte FTP LWS s'ouvre déjà dans htdocs
name: Déploiement LWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Envoi FTP vers LWS
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
